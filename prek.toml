# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# ビルド生成物や外部依存はチェック対象から除外する
exclude = "^(_build/|_install/|_source/|third_party/)"

# prek 組み込みの汎用フック (オフライン・追加セットアップ不要)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  # .clang-format などマルチドキュメント YAML を許可する
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "clang-format",
    name = "clang-format",
    entry = "python3 run.py format",
    language = "system",
    pass_filenames = false,
    types_or = ["c", "c++", "objective-c", "objective-c++"]
  }
]

# ruff: フォーマッタ・リンタ
# ruff のバイナリはフックが自前で用意するため、PATH 上の ruff に依存しない
# rev がそのまま ruff のバージョンになる。更新は prek auto-update で行う
# e2e-test/pyproject.toml の ruff とバージョンを揃える
# 設定はルートの ruff.toml を読む
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  # ruff format: フォーマッタ
  { id = "ruff-format", priority = 0 },
  # ruff check: リンタと自動修正
  { id = "ruff-check", priority = 10 }
]
