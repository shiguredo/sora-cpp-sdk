[project]
name = "sumomo-e2e-test"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    # テストランナー
    "pytest~=9.1.0",
    # テスト繰り返し実行
    "pytest-repeat~=0.9.4",
    # フレーキーテストのリトライ
    "pytest-retry~=1.7.0",
    # テストタイムアウト
    "pytest-timeout~=2.4.0",
    # HTTP クライアント (Sora API 等)
    "httpx~=0.28.1",
    # .env 読み込み
    "python-dotenv~=1.2.0",
    # リンタ・フォーマッタ
    "ruff~=0.16.0",
    # 静的型チェッカ
    "ty~=0.0.63",
    # JWT (access_token 署名)
    "pyjwt~=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
